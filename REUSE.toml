version = 1
SPDX-PackageName = "barrierlab"
SPDX-PackageSupplier = "CASOON"
SPDX-PackageDownloadLocation = "https://github.com/casoon/barrierlab"

# Alles in diesem Repository, sofern unten nichts Genaueres steht.
[[annotations]]
path = ["**"]
SPDX-FileCopyrightText = "2026 CASOON"
SPDX-License-Identifier = "MIT"

# Vendort aus validator/validator (Nu Html Checker, vnu), MIT — Einzelheiten in
# crates/html-conform/THIRD-PARTY-NOTICES.md. Genauer als die Regel oben und
# überschreibt sie deshalb (REUSE.toml: die letzte passende Tabelle gilt).
[[annotations]]
path = ["crates/html-conform/schema/**", "crates/html-conform/tests/corpus/**"]
SPDX-FileCopyrightText = "2007-2026 Mozilla Foundation, Henri Sivonen, and the W3C"
SPDX-License-Identifier = "MIT"

# Die vendorte RELAX-NG-Testsuite bringt eigene .license-Dateien mit
# (BSD-3-Clause); Herkunft in crates/relax-ng/tests/corpus/relaxng/UPSTREAM.md.

# Vendorte WPT-accname-Fälle (BSD-3-Clause); Herkunft in
# crates/accname/tests/corpus/wpt/UPSTREAM.md. UPSTREAM.md selbst bleibt MIT.
[[annotations]]
path = ["crates/accname/tests/corpus/wpt/**/*.html", "crates/accname/tests/corpus/wpt/LICENSE.md"]
SPDX-FileCopyrightText = "web-platform-tests contributors"
SPDX-License-Identifier = "BSD-3-Clause"

# Vendorte WPT-Media-Query-Fälle (BSD-3-Clause); Herkunft in
# crates/media-query-parse/tests/corpus/wpt/UPSTREAM.md. UPSTREAM.md selbst bleibt MIT.
[[annotations]]
path = ["crates/media-query-parse/tests/corpus/wpt/**/*.html", "crates/media-query-parse/tests/corpus/wpt/LICENSE.md"]
SPDX-FileCopyrightText = "web-platform-tests contributors"
SPDX-License-Identifier = "BSD-3-Clause"

# Vendorte css-parsing-tests (SimonSapin, CC0-1.0); Herkunft in
# crates/css-tokenize/tests/corpus/css-parsing-tests/UPSTREAM.md.
[[annotations]]
path = ["crates/css-tokenize/tests/corpus/css-parsing-tests/**"]
SPDX-FileCopyrightText = "2013 Simon Sapin"
SPDX-License-Identifier = "CC0-1.0"
