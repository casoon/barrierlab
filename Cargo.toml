[workspace]
members = []
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Jörn Seidel"]
repository = "https://github.com/casoon/barrierlab"
homepage = "https://casoon.github.io/barrierlab"

# Gemeinsame Abhängigkeiten werden hier gepflegt, sobald das erste Crate
# importiert ist (Phase 3). Interne Crates stehen dann mit `path` UND `version`
# hier, damit dasselbe Manifest lokal baut und veröffentlichbar bleibt.
[workspace.dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Fuer WASM-Artefakte (a11y-wasm, Phase 5): Groesse vor Geschwindigkeit.
# wasm-pack kennt kein --profile, deshalb ueber `cargo build --profile wasm-release`
# plus wasm-bindgen-CLI (siehe docs/releasing.md).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
