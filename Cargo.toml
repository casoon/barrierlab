[workspace]
members = [
    # L0 — Parser und Engines
    "crates/html5-parser",
    "crates/csp-parse",
    "crates/media-query-parse",
    "crates/xpath-eval",
    "crates/relax-ng",
    "crates/schematron-engine",
    # L1 — Modell
    "crates/a11y-report",
    "crates/a11y-dom",
    "crates/html-conform",
    # L2 — Berechnung
    "crates/accname",
    "crates/a11y-rules",
    # L3 — Auslieferung
    "crates/a11y-wasm",
]
# Eigene Workspaces, die vor dem Umzug schon getrennt waren: Fuzz-Ziele, das
# xtask-Hilfsprogramm und der Beispielgenerator.
exclude = [
    "crates/html-conform/fuzz",
    "crates/html-conform/xtask/check-file",
    "examples/a11y",
]
resolver = "3"

[workspace.package]
edition = "2024"
# Niedrigster gemeinsamer Stand der Pakete hier. Wer mehr braucht, setzt
# rust-version im eigenen Manifest (html-conform: 1.88).
rust-version = "1.85"
license = "MIT"
authors = ["Jörn Seidel <info@casoon.de>"]
repository = "https://github.com/casoon/barrierlab"
homepage = "https://casoon.github.io/barrierlab"
categories = ["accessibility", "web-programming"]

[workspace.dependencies]
# Intern: path fuer den lokalen Bau, version fuer die Veroeffentlichung.
html5-parser = { version = "0.4.0", path = "crates/html5-parser" }
csp-parse = { version = "0.1.0", path = "crates/csp-parse" }
media-query-parse = { version = "0.1.0", path = "crates/media-query-parse" }
xpath-eval = { version = "0.2.2", path = "crates/xpath-eval" }
relax-ng = { version = "0.2.0", path = "crates/relax-ng" }
schematron-engine = { version = "0.2.0", path = "crates/schematron-engine" }
html-conform = { version = "0.3.0", path = "crates/html-conform" }
a11y-report = { version = "0.10.2", path = "crates/a11y-report" }
a11y-rules = { version = "0.10.2", path = "crates/a11y-rules" }
a11y-dom = { version = "0.10.2", path = "crates/a11y-dom" }
accname = { version = "0.10.2", path = "crates/accname" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Fuer WASM-Artefakte (a11y-wasm, Phase 5): Groesse vor Geschwindigkeit.
# wasm-pack kennt kein --profile, deshalb ueber `cargo build --profile wasm-release`
# plus wasm-bindgen-CLI (siehe docs/releasing.md).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
panic = "abort"
