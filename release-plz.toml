[workspace]
# Ein Tag je Paket, nicht ein gemeinsamer Repo-Tag (E2/Release-Konvention).
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} {{ version }}"
git_release_body = "{{ changelog }}"
# Ohne Release-PR (siehe docs/releasing.md) muss release-plz auch bei einem
# normalen Push veroeffentlichen duerfen. Es nimmt nur, was noch nicht in der
# Registry steht; unveraenderte Versionen uebergeht es.
release_always = true
changelog_update = true
