# Size of the accessibility checker the package ships. `peakmark check` fails when it grows over the budget.
# Brotli budget 167000 -> 171000 B on 2026-11-23 (user decision): follows the 205 KB gzip budget of 2026-11-22 (focus per element, description rule, F91); measured 167.1 kB after the 0.31.0 release.
# Brotli budget 162500 -> 167000 B on 2026-11-17 (user decision): measured 164.5 kB with the media column (`withMedia`).
[[module]]
name     = "a11y-wasm"
artifact = "packages/a11y-wasm/pkg/a11y_wasm_bg.wasm"
glue     = "packages/a11y-wasm/pkg/a11y_wasm.js"

[module.budget]
brotli         = "171000 B"
peak_memory    = "1.8 MiB"
growth_per_run = "0"

[[scenario]]
module = "a11y-wasm"
file   = "scripts/peakmark/scan.mjs"
repeat = 20
