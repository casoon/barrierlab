name: Release

# Bis Phase 3 nur von Hand ausloesbar, damit nichts versehentlich
# veroeffentlicht wird. Danach kommt hier `push: branches: [main]` dazu.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, was passieren wuerde"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  # Fuer crates.io Trusted Publishing (OIDC) statt CARGO_REGISTRY_TOKEN.
  id-token: write

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Release-PR aktualisieren
        uses: release-plz/action@v0
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Veroeffentlichen
        if: ${{ inputs.dry_run == false }}
        uses: release-plz/action@v0
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
