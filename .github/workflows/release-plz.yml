name: Release

# Kein Release-PR: Actions duerfen in diesem Repo keine Pull Requests anlegen,
# und fuer ein Repo mit einem Betreuer braucht es den Umweg nicht. Versionen und
# Changelog-Eintraege kommen als normaler Commit; release-plz veroeffentlicht
# danach, was noch nicht in der Registry steht, und setzt Tag und GitHub-Release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, was veroeffentlicht wuerde"
        type: boolean
        default: true

permissions:
  contents: write
  # Trusted Publishing: release-plz tauscht das OIDC-Token selbst gegen ein
  # kurzlebiges crates.io-Token. Deshalb kein CARGO_REGISTRY_TOKEN und auch
  # kein rust-lang/crates-io-auth-action -- release-plz ruft dieselbe API.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      # release-plz bricht ohne veroeffentlichbare Pakete ab ("no public
      # packages found").
      - name: Workspace hat Member?
        id: members
        run: |
          if ls crates/*/Cargo.toml >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Noch kein Crate in crates/ - release-plz uebersprungen."
          fi

      - name: Veroeffentlichen
        if: steps.members.outputs.present == 'true' && inputs.dry_run != true
        uses: release-plz/action@v0.5.139
        with:
          command: release
          # Bleibt an: ohne -v sagt der Lauf nur "no token found", mit -v steht
          # die Antwort der Registry im Log (welche Claim-Angabe nicht passt).
          verbose: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Anzeigen, was veroeffentlicht wuerde
        if: steps.members.outputs.present == 'true' && inputs.dry_run == true
        run: |
          echo "Versionen im Repo:"
          cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; [print(" ", p["name"], p["version"]) for p in json.load(sys.stdin)["packages"]]'
          echo "Veroeffentlicht wird, was davon noch nicht auf crates.io steht."
