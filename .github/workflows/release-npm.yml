name: Release npm

# Tag `a11y-wasm-npm-vX.Y.Z` → build `@casoon/a11y-wasm`, then publish it to
# npm with Trusted Publishing (provenance, no stored token) after approval in
# the `npm` environment. The tag must match `packages/a11y-wasm/package.json`.
# A separate tag prefix: release-plz sets `a11y-wasm-vX.Y.Z` for the crate with
# the workflow token, and such a tag would not start this workflow.
on:
  push:
    tags:
      - "a11y-wasm-npm-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#a11y-wasm-npm-v}" = "$(node -p "require('./packages/a11y-wasm/package.json').version")"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # The CLI must match the wasm-bindgen version in Cargo.lock (same pin as ci.yml).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128,wasm-opt

      - run: node packages/a11y-wasm/build.mjs

      - name: Pack
        working-directory: packages/a11y-wasm
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Tarball contents
        run: |
          tar -tzf "$RUNNER_TEMP"/casoon-a11y-wasm-*.tgz | sort
          for f in package/LICENSE package/README.md package/package.json package/pkg/a11y_wasm.js package/pkg/a11y_wasm_bg.wasm package/pkg/a11y_wasm.d.ts; do
            tar -tzf "$RUNNER_TEMP"/casoon-a11y-wasm-*.tgz | grep -qx "$f" || { echo "missing: $f"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: a11y-wasm-tarball
          path: ${{ runner.temp }}/casoon-a11y-wasm-*.tgz
          if-no-files-found: error

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: a11y-wasm-tarball
          path: ${{ runner.temp }}/tarball

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (Trusted Publishing needs >= 11.5)
        run: npm install -g npm@latest

      # Absolute path: npm 12 reads a bare `dist/x.tgz` as a GitHub repo.
      - name: Publish
        run: npm publish --access public "$RUNNER_TEMP"/tarball/casoon-a11y-wasm-*.tgz
