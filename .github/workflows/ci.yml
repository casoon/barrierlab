name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Bis zum ersten Import (Phase 3) hat der Workspace keine Member; ein
      # virtuelles Manifest ohne Member laesst sich nicht bauen. Die Bedingung
      # faellt mit dem ersten Crate von selbst weg.
      - name: Workspace hat Member?
        id: members
        run: |
          if ls crates/*/Cargo.toml >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Noch kein Crate in crates/ — Rust-Schritte uebersprungen."
          fi

      - if: steps.members.outputs.present == 'true'
        run: cargo fmt --all --check
      - if: steps.members.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: steps.members.outputs.present == 'true'
        run: cargo test --workspace

      # Fuzz-Ziele und das xtask-Hilfsprogramm sind eigene Workspaces (sie waren
      # es vor dem Umzug schon) und laufen deshalb nicht mit `--workspace` mit.
      # Gebaut werden sie trotzdem, sonst verrotten sie unbemerkt.
      - if: steps.members.outputs.present == 'true'
        name: Ausgeschlossene Workspaces
        run: |
          for pfad in crates/html-conform/fuzz crates/html-conform/xtask/check-file; do
            echo "::group::$pfad"
            cargo check --manifest-path "$pfad/Cargo.toml" --all-targets
            echo "::endgroup::"
          done

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Jede Datei im Repository braucht Urheber- und Lizenzangabe (REUSE);
      # die vendorten Korpora haben eigene, abweichende — siehe REUSE.toml.
      - uses: fsfe/reuse-action@v5
      - uses: dtolnay/rust-toolchain@stable
      # Keine Abhaengigkeit mit einer Lizenz, die deny.toml nicht erlaubt.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Die CLI muss zur Crate-Version von wasm-bindgen passen, sonst bricht der
      # Schritt mit einem Schema-Fehler ab.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.128,wasm-opt
      - run: node packages/a11y-wasm/build.mjs
      - name: Groessenbudget (100 KB gzip)
        run: |
          python3 - <<'EOF'
          import gzip, sys
          p = "packages/a11y-wasm/pkg/a11y_wasm_bg.wasm"
          raw = open(p, "rb").read()
          gz = len(gzip.compress(raw, 9)) / 1024
          print(f"{len(raw)/1024:.1f} KB roh, {gz:.1f} KB gzip")
          if gz > 100:
              sys.exit(f"Budget ueberschritten: {gz:.1f} KB gzip > 100 KB")
          EOF

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm-Pakete vorhanden?
        id: pkgs
        run: |
          if ls packages/*/package.json >/dev/null 2>&1 || [ -d site ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Noch kein npm-Paket und keine Site — Node-Schritte uebersprungen."
          fi
      # Ohne version: Die Action nimmt packageManager aus der package.json.
      # Beides gesetzt bricht sie mit "Multiple versions of pnpm specified" ab.
      - if: steps.pkgs.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.pkgs.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.pkgs.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
