name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Neuer Push auf einen PR bricht den alten Lauf ab. Auf main nie: dort gibt es
# keinen Ersatz fuer einen abgebrochenen Lauf, und release-plz baut auf demselben
# Push in einem eigenen Workflow mit eigener Gruppe.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Bis zum ersten Import (Phase 3) hat der Workspace keine Member; ein
      # virtuelles Manifest ohne Member laesst sich nicht bauen. Die Bedingung
      # faellt mit dem ersten Crate von selbst weg.
      - name: Workspace hat Member?
        id: members
        run: |
          if ls crates/*/Cargo.toml >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Noch kein Crate in crates/ — Rust-Schritte uebersprungen."
          fi

      - if: steps.members.outputs.present == 'true'
        run: cargo fmt --all --check
      - if: steps.members.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - if: steps.members.outputs.present == 'true'
        run: cargo check -p a11y-rules --no-default-features
      - if: steps.members.outputs.present == 'true'
        run: cargo check -p a11y-static --no-default-features
      # Die Messspalten von a11y-wasm sind ein Standard-Feature; die schlanke
      # Variante ohne sie soll weiter bauen und testen.
      - if: steps.members.outputs.present == 'true'
        run: cargo clippy -p a11y-wasm --all-targets --no-default-features -- -D warnings
      - if: steps.members.outputs.present == 'true'
        run: cargo test -p a11y-wasm --no-default-features
      - if: steps.members.outputs.present == 'true'
        run: cargo test --workspace

      # Der Differentialtest gegen vnu ist #[ignore] (im Debug-Build zu langsam);
      # er ist das Gate fuer False Positives/Negatives und die Befundklassen
      # (tests/vnu-class-baseline.json), laeuft also eigens im Release-Profil.
      - if: steps.members.outputs.present == 'true'
        run: cargo test --release -p html-conform --test differential -- --ignored

      # Kaputte Doku-Verweise fallen sonst erst auf docs.rs auf, wo sie nicht
      # mehr zu korrigieren sind, ohne neu zu veroeffentlichen.
      - if: steps.members.outputs.present == 'true'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # Fuzz-Ziele und das xtask-Hilfsprogramm sind eigene Workspaces (sie waren
      # es vor dem Umzug schon) und laufen deshalb nicht mit `--workspace` mit.
      # Gebaut werden sie trotzdem, sonst verrotten sie unbemerkt.
      - if: steps.members.outputs.present == 'true'
        name: Ausgeschlossene Workspaces
        run: |
          for pfad in crates/html-conform/fuzz crates/html-conform/xtask/check-file; do
            echo "::group::$pfad"
            cargo check --manifest-path "$pfad/Cargo.toml" --all-targets
            echo "::endgroup::"
          done

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Jede Datei im Repository braucht Urheber- und Lizenzangabe (REUSE);
      # die vendorten Korpora haben eigene, abweichende — siehe REUSE.toml.
      - uses: fsfe/reuse-action@bb774aa972c2a89ff34781233d275075cbddf542 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      # Keine Abhaengigkeit mit einer Lizenz, die deny.toml nicht erlaubt.
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check licenses
      # Keine ungenutzte Abhaengigkeit in einem Manifest (auch in den eigenen
      # Workspaces unter examples/, fuzz/ und xtask/).
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-machete@0.10.1
      - run: cargo machete

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Die CLI muss zur Crate-Version von wasm-bindgen passen, sonst bricht der
      # Schritt mit einem Schema-Fehler ab.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: wasm-bindgen-cli@0.2.128,wasm-opt
      - run: node packages/a11y-wasm/build.mjs
      # 205 KB seit 22.11.2026 (Entscheidung des Nutzers): gemessen 200,8 KB gzip
      # mit der Fokusauswertung je Element, der Beschreibungsregel und F91.
      # 200 KB seit 17.11.2026 (Entscheidung des Nutzers): Messspalte fuer die
      # Wiedergabe selbststartender Medien (`withMedia`) und die Regeln aus
      # a11y-rules 0.30.x; das Modul lag vorher bei 195,0 KB gzip.
      # 195 KB seit 14.11.2026 (Entscheidung des Nutzers, barrierlab#225):
      # gemessen 192,5 KB gzip mit den Korrekturen aus den W3C-ACT-Testfaellen
      # (HTML-Tabellenmodell, Sprachlisten, Farbpaare, ARIA-Konfliktaufloesung).
      # 180 KB seit 09.11.2026 (Entscheidung des Nutzers, liveaudit#16): die
      # Messspalten fuer die seitenabhaengigen Regeln (Feature `probes`) sind im
      # Standardbau, sie brauchen rund 9 KB gzip.
      # 170 KB seit #47 (05.10.2026, Entscheidung des Nutzers): gemessen
      # 149,0 KB gzip mit Kontrast-AAA, Stylesheet- und Darstellungsregeln.
      # 150 KB seit B5-B7 und #22 (03.10.2026, Entscheidung des Nutzers):
      # gemessen 142,8 KB gzip mit allen portierten Regeln.
      # 130 KB seit B3 (Formularregeln, barrierlab#16), einmalig fuer B3-B7
      # angehoben (Entscheidung vom 01.10.2026): alle Regeln sollen auch in der
      # laufenden Seite (LiveAudit) greifen, die deutschen Texte bleiben drin.
      # Vorher 110 KB seit B1 (30.09.2026).
      - name: Groessenbudget (205 KB gzip)
        run: |
          python3 - <<'EOF'
          import gzip, sys
          p = "packages/a11y-wasm/pkg/a11y_wasm_bg.wasm"
          raw = open(p, "rb").read()
          gz = len(gzip.compress(raw, 9)) / 1024
          print(f"{len(raw)/1024:.1f} KB roh, {gz:.1f} KB gzip")
          if gz > 205:
              sys.exit(f"Budget ueberschritten: {gz:.1f} KB gzip > 205 KB")
          EOF
      # Groesse und Speicher des Moduls gegen die eingecheckte Baseline
      # (peakmark.toml, peakmark.baseline.json). Das Binary kommt aus dem
      # Release von casoon/peakmark, Hash und Build-Provenance werden geprueft.
      - name: peakmark installieren
        env:
          GH_TOKEN: ${{ github.token }}
          PEAKMARK_VERSION: "0.1.1"
        run: |
          name="peakmark-${PEAKMARK_VERSION}-x86_64-unknown-linux-musl"
          gh release download "v${PEAKMARK_VERSION}" --repo casoon/peakmark \
            --pattern "${name}.tar.gz*" --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          sha256sum -c "${name}.tar.gz.sha256"
          gh attestation verify "${name}.tar.gz" --repo casoon/peakmark
          tar -xzf "${name}.tar.gz"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      - name: peakmark check
        run: peakmark check --details
      # Groessenbudget (782 KiB gzip) und Fixture-Tests des Pakets
      # html-conform-wasm (barrierlab#73): build.mjs bricht bei Ueberschreitung ab.
      - run: node packages/html-conform-wasm/build.mjs
      - run: npm test
        working-directory: packages/html-conform-wasm

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: npm-Pakete vorhanden?
        id: pkgs
        run: |
          if ls packages/*/package.json >/dev/null 2>&1 || [ -d site ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Noch kein npm-Paket und keine Site — Node-Schritte uebersprungen."
          fi
      # Ohne version: Die Action nimmt packageManager aus der package.json.
      # Beides gesetzt bricht sie mit "Multiple versions of pnpm specified" ab.
      - if: steps.pkgs.outputs.present == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.pkgs.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.pkgs.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
