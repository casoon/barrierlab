name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Dieses Repository hat eine package.json im Wurzelverzeichnis; die
      # pnpm-Version steht dort als packageManager. Beides gesetzt bricht die
      # Action mit "Multiple versions of pnpm specified" ab.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          # Ein Workspace, ein Lockfile: die Seite haengt als Paket mit drin.
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build site
        run: |
          pnpm install --frozen-lockfile
          # Mermaid wird zur Bauzeit zu Inline-SVG gerendert; rehype-mermaid
          # braucht dafuer einen Browser. Ohne Laufzeit-JavaScript auf der Seite.
          # Ohne --with-deps: das Runner-Image hat die Bibliotheken fuer Chromium
          # schon, und der Bau haengt so nicht am apt-Spiegel der Runner.
          pnpm --filter barrierlab-site exec playwright install chromium
          pnpm --filter barrierlab-site build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
