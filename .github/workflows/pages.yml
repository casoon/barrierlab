name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dieses Repository hat eine package.json im Wurzelverzeichnis; die
      # pnpm-Version steht dort als packageManager. Beides gesetzt bricht die
      # Action mit "Multiple versions of pnpm specified" ab.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - uses: actions/configure-pages@v6

      - name: Build site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          # Mermaid wird zur Bauzeit zu Inline-SVG gerendert; rehype-mermaid
          # braucht dafuer einen Browser. Ohne Laufzeit-JavaScript auf der Seite.
          pnpm exec playwright install --with-deps chromium
          pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
