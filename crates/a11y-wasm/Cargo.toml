[package]
name = "a11y-wasm"
version = "0.16.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
categories.workspace = true
description = "WASM boundary and arena adapter for the a11y rule set: run the same accessibility rules inside a live page."
keywords = ["accessibility", "a11y", "wasm", "webassembly", "aria"]
readme = "README.md"

[features]
default = ["probes"]
# Messspalten für die seitenabhängigen Regeln (`Scan::withFrames` und Verwandte).
# Standardmäßig an (Größenbudget 180 KB gzip, 09.11.2026); mit
# `--no-default-features` entsteht die schlanke Variante ohne die Spalten.
probes = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
a11y-dom = { workspace = true }
a11y-report = { workspace = true }
a11y-rules = { workspace = true }
accname = { workspace = true }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[dev-dependencies]
serde_json = { workspace = true }
