# Mutationen der Merkmalsprofile (structured_data) — siehe xtask/mutate.py.
# `id` ist der Schlüssel des SchemaFeature; der Test `korpus_faelle` in tests/korpus.rs.

[[mutation]]
id = "product_snippet"
file = "src/structured_data/rules.rs"
kind = "drop-requirement"
test = "korpus"
find = '''
    if !any_present(content, &["review", "aggregateRating", "offers"]) {'''
replace = '''
    if false {'''
expect = "killed"

[[mutation]]
id = "product_snippet"
file = "src/structured_data/rules.rs"
kind = "invert"
test = "korpus"
find = '''
        } else if !any_present(offer, &["price", "priceSpecification.price"]) {'''
replace = '''
        } else if any_present(offer, &["price", "priceSpecification.price"]) {'''
expect = "killed"

