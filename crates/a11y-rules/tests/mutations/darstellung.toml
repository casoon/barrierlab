[[mutation]]
id = "contrast/text-insufficient"
file = "src/rendering.rs"
kind = "threshold"
find = '''let Some((urteil, schwelle, gross)) = urteile(&messung, 4.5, 3.0) else {'''
replace = '''let Some((urteil, schwelle, gross)) = urteile(&messung, 4.49, 3.0) else {'''
test = "korpus"
expect = "killed"

