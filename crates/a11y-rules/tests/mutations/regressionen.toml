# Mutationen zu den Regressionen aus dem Browserkorpus (783-shared-bugs) — stellen je den alten Fehler wieder her.

[[mutation]]
id = "tables/headers-attr-invalid"
file = "src/structure.rs"
kind = "scope"
test = "korpus"
find = '''
        // vermittelt in diesem Zustand keine Zuordnung.
        scope: Scope::AccessibilityTree,'''
replace = '''
        // vermittelt in diesem Zustand keine Zuordnung.
        scope: Scope::Markup,'''
expect = "killed"

