# Mutationen der Gruppe „aria“ — siehe xtask/mutate.py

[[mutation]]
id = "aria/attribute-unknown"
file = "src/aria.rs"
kind = "invert"
find = 'attribute_index(name).is_some()'
replace = 'attribute_index(name).is_none()'
test = "korpus"
expect = "killed"

