# Mutationen der Gruppe „aria“ — siehe xtask/mutate.py

[[mutation]]
id = "aria/attribute-unknown"
file = "src/aria.rs"
kind = "invert"
find = 'attribut_index(name).is_some()'
replace = 'attribut_index(name).is_none()'
test = "korpus"
expect = "killed"

[[mutation]]
id = "aria/attribute-value-invalid"
file = "src/aria.rs"
kind = "invert"
find = 'if v.is_empty() || wert_gueltig(&typ, v) {'
replace = 'if v.is_empty() || !wert_gueltig(&typ, v) {'
test = "korpus"
expect = "killed"

[[mutation]]
id = "aria/owns-conflict"
