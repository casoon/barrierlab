# --- focus/obscured (Fokusmessung) --------------------------------------------

[[mutation]]
id = "focus/obscured"
file = "src/heuristics.rs"
kind = "threshold"
find = '''c.points > 0 && c.covered >= c.points'''
replace = '''c.points > 0 && c.covered + 1 >= c.points'''
test = "korpus"
expect = "killed"

[[mutation]]
id = "focus/obscured"
file = "src/heuristics.rs"
kind = "drop-condition"
find = '''c.points > 0 && c.covered >= c.points'''
replace = '''c.covered >= c.points'''
test = "korpus"
expect = "killed"

[[mutation]]
id = "focus/obscured"
file = "src/heuristics.rs"
kind = "drop-condition"
find = '''            && cover.is_none()
            && per_tab_reachable(n)'''
replace = '''            && per_tab_reachable(n)'''
test = "korpus"
expect = "killed"
note = "Die Messung nach dem Fokussieren ersetzt das statische Bit."

