# Mutationen der Gruppe „sonden“ — siehe xtask/mutate.py

# --- frames/cross-origin ------------------------------------------------------

[[mutation]]
id = "frames/cross-origin"
file = "src/probes.rs"
kind = "invert"
find = '''            Some(true) => measured = true,
            Some(false) => {'''
replace = '''            Some(false) => measured = true,
            Some(true) => {'''
test = "korpus"
expect = "killed"

[[mutation]]
id = "frames/cross-origin"
file = "src/probes.rs"
kind = "threshold"
find = '''        .is_some_and(|b| b.width <= 1.0 || b.height <= 1.0)'''
replace = '''        .is_some_and(|b| b.width < 1.0 || b.height < 1.0)'''
test = "korpus"
expect = "killed"
note = "Ein Kasten von genau 1 px ist ausgenommen."

[[mutation]]
id = "frames/cross-origin"
file = "src/probes.rs"
kind = "drop-condition"
find = '''        || n.has_attr("hidden")
        || n.attr("aria-hidden")
            .is_some_and(|v| v.trim().eq_ignore_ascii_case("true"))
    {'''
replace = '''        || n.has_attr("hidden")
    {'''
test = "korpus"
expect = "killed"

[[mutation]]
id = "frames/cross-origin"
file = "src/probes.rs"
kind = "drop-finding"
find = '''    if candidates && !measured {
        out.push(not_run::note(
            "frames/cross-origin",'''
replace = '''    if false && candidates && !measured {
        out.push(not_run::note(
            "frames/cross-origin",'''
test = "korpus"
expect = "killed"
note = "Ohne Messung kein NotRun-Vermerk: stilles Bestehen."

# --- orientation/root-rotated -------------------------------------------------

[[mutation]]
id = "orientation/root-rotated"
file = "src/probes.rs"
kind = "threshold"
find = '''    Some(b.abs() > 0.01 && (b + c).abs() < 0.01)'''
replace = '''    Some(b.abs() > 0.011 && (b + c).abs() < 0.01)'''
test = "korpus"
expect = "killed"

[[mutation]]
id = "orientation/root-rotated"
file = "src/probes.rs"
kind = "drop-condition"
find = '''    Some(b.abs() > 0.01 && (b + c).abs() < 0.01)'''
replace = '''    Some(b.abs() > 0.01)'''
test = "korpus"
expect = "killed"
note = "Neigung (b ohne passendes c) wäre sonst eine Drehung."

[[mutation]]
id = "orientation/root-rotated"
file = "src/probes.rs"
kind = "invert"
find = '''        (rest, 1, 4)'''
replace = '''        (rest, 1, 5)'''
test = "korpus"
expect = "killed"
note = "Falscher Spaltenindex für c in matrix3d."

[[mutation]]
id = "orientation/root-rotated"
file = "src/probes.rs"
kind = "drop-condition"
find = '''    Some(axis && off > 0.01 && off < 179.99)'''
replace = '''    Some(off > 0.01 && off < 179.99)'''
test = "korpus"
expect = "killed"
note = "Kippen um X oder Y ist keine Drehung in der Bildebene."

[[mutation]]
id = "orientation/root-rotated"
file = "src/probes.rs"
kind = "drop-finding"
find = '''    if roots && !measured {'''
replace = '''    if false && roots && !measured {'''
test = "korpus"
expect = "killed"

[[mutation]]
id = "orientation/root-rotated"
file = "src/probes.rs"
kind = "drop-condition"
find = '''    for n in elements(doc).filter(|n| matches!(n.local_name(), "html" | "body")) {'''
replace = '''    for n in elements(doc) {'''
test = "korpus"
expect = "killed"
note = "Nur html und body zählen, nicht jedes gedrehte Bauteil."

