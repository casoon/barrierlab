[package]
name = "xpath-eval"
version = "0.2.3"
edition = "2024"
description = "A pure-Rust XPath 1.0 expression evaluator, generic over the document model"
license = "MIT"
repository.workspace = true

[dependencies]

[dev-dependencies]
# Only for tests: the Jaxen corpus (tests/jaxen.rs) is XML.
roxmltree = "0.21.1"
# The shared roxmltree adapter. Path only, no version: it depends on this
# crate, so Cargo drops the entry when packaging.
xml-adapters = { path = "../xml-adapters", default-features = false, features = ["xpath"] }
