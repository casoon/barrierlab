[package]
name = "relax-ng"
version = "0.2.3"
edition = "2024"
description = "A pure-Rust RELAX NG schema parser and validator"
license = "MIT"
repository.workspace = true

[features]
# Binary form of a compiled schema (`Schema::to_bytes`/`from_bytes`); no extra dependencies.
serialize = []

[dependencies]
regex = "1"
roxmltree = "0.21.1"
unicode-ident = "1"

[dev-dependencies]
roxmltree = "0.21.1"
