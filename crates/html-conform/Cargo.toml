[package]
name = "html-conform"
version = "0.5.0"
edition = "2024"
license = "MIT"
description = "HTML5 conformance checking as a Rust dependency (vnu-comparable, no JVM runtime)."
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version = "1.88.0"
keywords = ["html", "html5", "validator", "conformance", "vnu"]
categories = ["web-programming", "parser-implementations", "development-tools"]
exclude = ["/tests/corpus", "/xtask", "/fuzz", "/benches", "/site", "/docs", "/examples"]

[features]
# Compile the vendored RELAX NG schema at first use instead of loading prebuilt/html5.rngc.
runtime-compile = []
# Adds `SchemaPreset` and `check_with_preset` (vnu's `html5-rdfalite` preset, RDFa Lite 1.1 only) and
# embeds a second compiled schema, `prebuilt/html5-rdfalite.rngc` (about 247 KB). The file is part of
# the crate tarball either way; without the feature it is not compiled in.
rdfa-lite = []
# Builds the `html-conform` command-line binary. Adds no dependency.
cli = []

[dependencies]
a11y-report = { workspace = true }
csp-parse = { workspace = true }
encoding_rs = "0.8"
html5-parser = { workspace = true }
media-query-parse = { workspace = true }
relax-ng = { workspace = true, features = ["serialize"] }
schematron-engine = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
xpath-eval = { workspace = true }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "check"
harness = false

[[bin]]
name = "html-conform"
path = "src/cli/main.rs"
required-features = ["cli"]

[[test]]
name = "cli"
required-features = ["cli"]
