[package]
name = "schematron-engine"
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
description = "A Rust ISO Schematron rule engine, generic over the document model"
readme = "README.md"
keywords = ["schematron", "xml", "validation", "xpath"]
categories = ["parser-implementations"]
license = "MIT"
repository.workspace = true

[features]
# `queryBinding="xslt2"`/`"xpath2"` through the XPath 2.0 mode of xpath-eval. Off: those
# bindings are rejected as before and no XPath 2.0 code is linked.
default = ["xpath2"]
xpath2 = []

[dependencies]
roxmltree = "0.21.1"
xpath-eval = { workspace = true }

[[bench]]
name = "evaluate"
harness = false
