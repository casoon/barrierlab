[package]
name = "schematron-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust ISO Schematron rule engine, generic over the document model"
readme = "README.md"
keywords = ["schematron", "xml", "validation", "xpath"]
categories = ["parser-implementations"]
license = "MIT"
repository.workspace = true

[dependencies]
roxmltree = "0.21.1"
xpath-eval = { workspace = true }

[[bench]]
name = "evaluate"
harness = false
